name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate migrations on a fresh SQLite database
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci-migrations.db
          ENVIRONMENT: development
          SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
        run: python -m alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit
      - run: npm run build
