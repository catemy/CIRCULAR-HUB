services:
  - type: web
    name: circularhub-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: staging
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://circularhub-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: circularhub-db
          property: connectionString

  - type: web
    name: circularhub-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://circularhub-api.onrender.com

databases:
  - name: circularhub-db
    plan: free
    databaseName: circularhub
    user: circularhub
